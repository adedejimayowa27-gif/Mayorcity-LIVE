<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password — Mayorcity LIVE</title>
  <meta name="description" content="Set a new password for your Mayorcity LIVE account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="auth-shell">
    <main class="auth-main" id="main-content">
      <div class="auth-card">
        <a class="auth-logo" href="/" aria-label="Mayorcity LIVE home">
          <span class="dot" aria-hidden="true"></span>
          Mayorcity LIVE
        </a>

        <div id="reset-password-content">
          <h1>Set a new password</h1>
          <p>Choose a new password for your account.</p>

          <form class="auth-form" id="reset-password-form" novalidate>
            <div class="field" id="password-field">
              <label class="field-label" for="password">New password</label>
              <input class="input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
              <span class="field-hint">At least 8 characters.</span>
              <span class="field-error-text" id="password-error" hidden>Password must be at least 8 characters.</span>
            </div>

            <div class="field" id="confirm-password-field">
              <label class="field-label" for="confirm-password">Confirm new password</label>
              <input class="input" type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
              <span class="field-error-text" id="confirm-password-error" hidden>Passwords don't match.</span>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Update password</button>
          </form>
        </div>

        <p class="auth-footer-link">
          <a href="/signin.html">Back to sign in</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="/src/pages/resetPassword.js"></script>
</body>
</html>
