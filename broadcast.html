<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadcast — Mayorcity LIVE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />
  <link rel="stylesheet" href="/src/styles/broadcast.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="dash-topbar">
    <div class="container dash-topbar-inner">
      <a class="navbar-logo" href="/dashboard.html" aria-label="Back to dashboard">
        <span class="dot" aria-hidden="true"></span>
        Mayorcity LIVE
      </a>
      <a class="btn btn-secondary" href="/dashboard.html">Back to dashboard</a>
    </div>
  </header>

  <main id="main-content">
    <div class="broadcast-shell" id="broadcast-shell">
      <!-- Populated by broadcastPage.js once the event and camera are ready -->
    </div>
  </main>

  <div class="modal-overlay" id="end-broadcast-modal" data-open="false">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="end-broadcast-modal-title">
      <div class="modal-header">
        <h2 id="end-broadcast-modal-title" style="font-size: var(--text-md);">End this broadcast?</h2>
        <button class="modal-close" type="button" data-modal-close aria-label="Close">&times;</button>
      </div>
      <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-6);">
        Your viewers will be disconnected immediately. This can't be undone.
      </p>
      <div style="display: flex; gap: var(--space-3);">
        <button class="btn btn-secondary btn-block" type="button" data-modal-close>Keep broadcasting</button>
        <button class="btn btn-primary btn-block" type="button" id="confirm-end-broadcast">End broadcast</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/broadcastPage.js"></script>
</body>
</html>
