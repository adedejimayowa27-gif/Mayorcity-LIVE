<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Mayorcity LIVE</title>
  <meta name="description" content="Create a Mayorcity LIVE account and start broadcasting from your phone." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="auth-shell">
    <main class="auth-main" id="main-content">
      <div class="auth-card">
        <a class="auth-logo" href="/" aria-label="Mayorcity LIVE home">
          <span class="dot" aria-hidden="true"></span>
          Mayorcity LIVE
        </a>

        <h1>Create your account</h1>
        <p>Set up an account to start broadcasting.</p>

        <form class="auth-form" id="signup-form" novalidate>
          <div class="field" id="name-field">
            <label class="field-label" for="name">Full name</label>
            <input class="input" type="text" id="name" name="name" autocomplete="name" required />
            <span class="field-error-text" id="name-error" hidden>Enter your name.</span>
          </div>

          <div class="field" id="email-field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" required />
            <span class="field-error-text" id="email-error" hidden>Enter a valid email address.</span>
          </div>

          <div class="field" id="password-field">
            <label class="field-label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
            <span class="field-hint">At least 8 characters.</span>
            <span class="field-error-text" id="password-error" hidden>Password must be at least 8 characters.</span>
          </div>

          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-footer-link">
          Already have an account? <a href="/signin.html">Sign in</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="/src/pages/signup.js"></script>
</body>
</html>
