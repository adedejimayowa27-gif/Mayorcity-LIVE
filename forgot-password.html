<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password — Mayorcity LIVE</title>
  <meta name="description" content="Reset the password for your Mayorcity LIVE account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="auth-shell">
    <main class="auth-main" id="main-content">
      <div class="auth-card">
        <a class="auth-back" href="/signin.html">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M8.5 3L4 7l4.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to sign in
        </a>

        <h1>Reset your password</h1>
        <p>Enter your email and we'll send you a link to reset your password.</p>

        <form class="auth-form" id="forgot-password-form" novalidate>
          <div class="field" id="email-field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" required />
            <span class="field-error-text" id="email-error" hidden>Enter a valid email address.</span>
          </div>

          <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        </form>

        <p class="auth-footer-link">
          Don't have an account? <a href="/signup.html">Create one</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="/src/pages/forgotPassword.js"></script>
</body>
</html>
