<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Mayorcity LIVE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="dash-topbar">
    <div class="container dash-topbar-inner">
      <a class="navbar-logo" href="/" aria-label="Mayorcity LIVE home">
        <span class="dot" aria-hidden="true"></span>
        Mayorcity LIVE
      </a>
      <div id="dash-actions"></div>
    </div>
  </header>

  <main id="main-content">
    <div class="dash-shell">
      <div class="dash-welcome" id="dash-welcome">
        <!-- Populated by dashboard.js once the session is confirmed -->
      </div>

      <section class="card dash-create-card" aria-labelledby="create-event-heading">
        <h2 class="dash-section-title" id="create-event-heading">Create an event</h2>

        <form id="create-event-form" novalidate>
          <div class="field" id="title-field">
            <label class="field-label" for="event-title">Title</label>
            <input class="input" type="text" id="event-title" name="title" required placeholder="e.g. Sunday Morning Service" />
            <span class="field-error-text" id="title-error" hidden>Give your event a title.</span>
          </div>

          <div class="dash-form-row">
            <div class="field" id="category-field">
              <label class="field-label" for="event-category">Category</label>
              <select class="input" id="event-category" name="category"></select>
            </div>

            <div class="field" id="scheduled-field">
              <label class="field-label" for="event-scheduled">Date &amp; time (optional)</label>
              <input class="input" type="datetime-local" id="event-scheduled" name="scheduledFor" />
            </div>
          </div>

          <div class="field" id="description-field">
            <label class="field-label" for="event-description">Description (optional)</label>
            <input class="input" type="text" id="event-description" name="description" placeholder="A short description viewers will see" />
          </div>

          <button class="btn btn-primary" type="submit">Create event</button>
        </form>
      </section>

      <section aria-labelledby="my-events-heading">
        <h2 class="dash-section-title" id="my-events-heading">Your events</h2>
        <div id="events-list"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
