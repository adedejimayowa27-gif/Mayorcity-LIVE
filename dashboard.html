<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Mayorcity LIVE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    /* Minimal dashboard shell for this batch only. A full dashboard layout
       (sidebar, nested nav, etc.) belongs to whichever later batch first
       needs it — kept out of dashboard.css until there's real content. */
    .dash-topbar {
      border-bottom: 1px solid var(--color-border);
    }
    .dash-topbar-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-main {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="dash-topbar">
    <div class="container dash-topbar-inner">
      <a class="navbar-logo" href="/" aria-label="Mayorcity LIVE home">
        <span class="dot" aria-hidden="true"></span>
        Mayorcity LIVE
      </a>
      <div id="dash-actions"></div>
    </div>
  </header>

  <main class="dash-main" id="main-content">
    <div class="container" id="dash-content" style="max-width: 480px;">
      <!-- Populated by dashboard.js once the session is confirmed -->
    </div>
  </main>

  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
